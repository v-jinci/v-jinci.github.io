# Pages CMS 配置（表单式后台）
# 文档：https://pagescms.org/docs/configuration/
#
# 用法：打开 pagescms.org → 用 GitHub 登录 → 添加仓库 v-jinci/v-jinci.github.io
#       → 分支一定选 hexo-src（不是 master！master 是编译后的成品）
#
# 注意：settings.content.merge 必须是 true，
#       否则保存时会把这个 schema 之外的 front-matter（top_img / type 等）删掉。

# 图片库：上传的图片都进 source/img/，正文里写成 /img/xxx.png
# 必须用「数组 + name」的写法，下面的字段才能用 options.media: images 指过来。
# 用单对象写法时，正文工具栏的图片按钮不会出现（这是之前找不到上传按钮的原因）。
media:
  - name: images
    label: 图片库
    input: source/img
    output: /img
    categories: [image]
    rename: false
    commit:
      templates:
        create: "img(create): {filename}"
        update: "img(update): {filename}"
        delete: "img(delete): {filename}"

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "post(create): {filename}"
      update: "post(update): {filename}"
      delete: "post(delete): {filename}"
      rename: "post(rename): {oldFilename} -> {newFilename}"

content:
  # ---------------- 文章 ----------------
  - name: posts
    label: 文章
    type: collection
    path: source/_posts
    format: yaml-frontmatter
    # 新文章文件名带日期前缀：2026-11-11-标题.md
    # 这样两篇文章重名也不会互相覆盖（以前的写法只按标题命名，重名会直接盖掉旧的）
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布日期
        type: date
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss"
      - name: description
        label: 摘要（列表页显示的一句话）
        type: text
      # 填了密码，这篇在网页上就要输密码才能看（本地写作、保存都不受影响）
      - name: password
        label: 访问密码（留空＝公开；填了就要输密码才能看）
        type: string
      # 正文里图片默认多大（只影响这一篇；单张图想单独调，在图片地址后加 ?w=50%）
      - name: img_width
        label: 正文图片宽度（只影响这一篇）
        type: select
        default: ""
        options:
          values:
            - label: 撑满（默认，跟全站设置一致）
              value: ""
            - label: 100%
              value: "100"
            - label: 85%
              value: "85"
            - label: 70%
              value: "70"
            - label: 60%
              value: "60"
            - label: 50%
              value: "50"
      - name: tags
        label: 标签
        type: string
        list: true
      - name: categories
        label: 分类
        type: string
        list: true
      # 封面图：填了它，文章底部「上一篇 / 下一篇」卡片就用这张图打底
      - name: cover
        label: 封面图（可不填，不填用默认深色渐变）
        type: image
        options:
          media: images
          categories: [image]
          rename: false
      - name: body
        label: 正文（插图：在正文里输入斜杠 / 选「图片」即可上传；也能直接把图片拖进正文）
        type: rich-text
        options:
          # 指向上面的 images 图片库 → 支持斜杠菜单插图 + 拖拽/粘贴上传
          media: images
          categories: [image]
          format: markdown
          switcher: true
          rename: false

  # ---------------- 独立页面 ----------------
  - name: pages
    label: 独立页面
    type: group
    items:
      - name: about
        label: 关于
        type: file
        path: source/about/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: string
            required: true
          - name: body
            label: 正文
            type: rich-text
            options:
              media: images
              format: markdown

      - name: link
        label: 友链
        type: file
        path: source/link/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: string
            required: true
          - name: body
            label: 正文
            type: rich-text
            options:
              media: images
              format: markdown

      - name: messageBoard
        label: 留言板
        type: file
        path: source/messageBoard/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: string
            required: true
          - name: body
            label: 正文（留言板本身是空的，评论组件会渲染在下面）
            type: rich-text
            options:
              media: images
              format: markdown

      - name: history
        label: 编年史
        type: file
        path: source/history/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: string
            required: true
          - name: body
            label: 正文
            type: rich-text
            options:
              media: images
              format: markdown
