    /* ============================================================
       富文本预览兜底样式
       关键：Sveltia 0.270 的 HTML 转换器在渲染预览时会清洗 style，
       白名单里有 color / text-align / font-weight，但没有 font-size，
       所以 inline 的 font-size 在「编辑区预览」里会失效。
       解决：组件同时写入 class，由这里用 !important 兜底显示；
       同时 inline 的 font-size 仍保留，保证保存到文件 / 发布后正常。
       ============================================================ */
    .wb-fs-14{font-size:14px!important}
    .wb-fs-16{font-size:16px!important}
    .wb-fs-20{font-size:20px!important}
    .wb-fs-26{font-size:26px!important}
    .wb-fs-32{font-size:32px!important}
    [data-wb-combo],[data-wb-align],[data-wb-size],[data-wb-color]{margin:6px 0}
    .wb-callout-hl{border-left:4px solid #2563eb;padding:8px 14px;background:#eff6ff;border-radius:6px;margin:8px 0}
    .wb-callout-hl[data-wb-callout="注意"]{border-color:#d97706;background:#fffbeb}
    .wb-callout-hl[data-wb-callout="重点"]{border-color:#7c3aed;background:#f5f3ff}
    .wb-callout-hl[data-wb-callout="警告"]{border-color:#dc2626;background:#fef2f2}
    .wb-callout-hl[data-wb-callout="金句"]{border-color:#94a3b8;background:#f8fafc;text-align:center;font-size:1.2em;color:#64748b}
    .wb-btn-hl{display:inline-block;padding:8px 20px;border-radius:9999px;background:#4a6cf7;color:#fff!important;text-decoration:none}
    .wb-cap-hl{display:block;text-align:center;font-size:.85em;color:#94a3b8;margin:4px 0}
    .wb-table-hl{border-collapse:collapse;width:100%;margin:8px 0}
    .wb-table-hl th,.wb-table-hl td{border:1px solid #cbd5e1;padding:6px 10px}
    .wb-table-hl th{background:#f1f5f9}

    /* 撤销/恢复悬浮按钮：Sveltia 0.270 工具栏没有这两个按钮，
       这里浮在正文编辑区旁边，用 Lexical 原生 historyUndo/historyRedo 命令。
       注意：必须用 beforeinput 事件触发，合成 KeyboardEvent 不会生效。 */
    #wb-history-dock{position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;gap:6px;
      padding:6px;background:rgba(255,255,255,.96);border:1px solid #d8dee9;border-radius:12px;
      box-shadow:0 4px 18px rgba(15,23,42,.18)}
    #wb-history-dock button{font:600 13px/1 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
      padding:9px 13px;border:0;border-radius:8px;background:#4a6cf7;color:#fff;cursor:pointer;
      box-shadow:0 1px 3px rgba(15,23,42,.15)}
    #wb-history-dock button:hover{background:#3453d4}
    #wb-history-dock button:disabled{background:#c3cad6;cursor:not-allowed}
    #wb-history-dock .wb-hb-redo{background:#64748b}
    #wb-history-dock .wb-hb-redo:hover{background:#475569}
    /* 拖动手柄 + 复位按钮：避免悬浮条挡住正文 */
    #wb-history-dock .wb-hb-handle{display:flex;align-items:center;padding:0 4px;
      font:600 14px/1 sans-serif;color:#94a3b8;cursor:grab;user-select:none;touch-action:none}
    #wb-history-dock .wb-hb-handle:active{cursor:grabbing}
    #wb-history-dock .wb-hb-reset{background:#94a3b8;padding:9px 10px}
    #wb-history-dock .wb-hb-reset:hover{background:#64748b}
    #wb-history-dock.wb-hb-dragging{opacity:.92;box-shadow:0 8px 28px rgba(15,23,42,.28)}

      window.addEventListener('load', function () {
        // 先注销旧版 /admin/sw.js（作用域太小，拦不到 /libs/），再注册根目录新版
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) {
            try {
              var u = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || '';
              if (/\/admin\/sw\.js$/.test(u)) return r.unregister();
            } catch (e) {}
            return null;
          }));
        }).catch(function () {}).then(function () {
          return navigator.serviceWorker.register('/sw.js');
        }).catch(function () {});
      });
    }
  </script>

  <!-- 悬浮条位置可拖动：拖手柄移动，自动记住位置，点 ⟲ 复位 -->
  <script>
    (function () {
      var dock = document.getElementById('wb-history-dock');
      var handle = document.getElementById('wb-history-handle');
      var resetBtn = document.getElementById('wb-history-reset');
      if (!dock || !handle) return;
      var KEY = 'wb-history-dock-pos-v1';

      function save(p) { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {} }
      function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }

      function clamp(x, y) {
        var w = dock.offsetWidth || 240, h = dock.offsetHeight || 44;
        return {
          x: Math.max(8, Math.min(x, window.innerWidth - w - 8)),
          y: Math.max(8, Math.min(y, window.innerHeight - h - 8))
        };
      }
      function place(x, y) {
        var p = clamp(x, y);
        dock.style.left = p.x + 'px';
        dock.style.top = p.y + 'px';
        dock.style.right = 'auto';
        dock.style.bottom = 'auto';
        return p;
      }
      function resetPos() {
        dock.style.left = ''; dock.style.top = '';
        dock.style.right = ''; dock.style.bottom = '';
        save(null);
      }

      var saved = load();
      if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') place(saved.x, saved.y);

      var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
      handle.addEventListener('pointerdown', function (e) {
        dragging = true;
        var r = dock.getBoundingClientRect();
        ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY;
        dock.classList.add('wb-hb-dragging');
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      });
      handle.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        place(ox + (e.clientX - sx), oy + (e.clientY - sy));
      });
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        dock.classList.remove('wb-hb-dragging');
        var r = dock.getBoundingClientRect();
        save(place(r.left, r.top));
        try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
      }
      handle.addEventListener('pointerup', endDrag);
      handle.addEventListener('pointercancel', endDrag);
      handle.addEventListener('dblclick', function (e) { e.preventDefault(); resetPos(); });
      if (resetBtn) resetBtn.addEventListener('click', function () { resetPos(); });
      window.addEventListener('resize', function () {
        var r = dock.getBoundingClientRect();
        if (dock.style.left) save(place(r.left, r.top));
      });
    })();
  </script>

  <!-- 体验沙盒专用：Sveltia 0.270 最新版（正式 /cms/ 仍用 0.265，互不影响） -->
  <script src="/libs/sveltia-270/sveltia-cms.js"></script>
  <script>
    (function () {
      var LOADED = [];

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      // 把 20px 这样的值转成 class 后缀 20
      function sizeSuffix(s) {
        return String(s || '20px').replace(/[^0-9]/g, '') || '20';
      }
      function sizeClass(s) { return 'wb-fs-' + sizeSuffix(s); }
      function sizeFromClass(el) {
        var m = String(el.getAttribute('class') || '').match(/wb-fs-(\d+)/);
        return m ? m[1] + 'px' : '';
      }
      // 解析 style 里的某个属性
      function styleVal(el, prop) {
        var s = (el.getAttribute('style') || '').toLowerCase();
        var m = s.match(new RegExp('(?:^|;)\\s*' + prop + '\\s*:\\s*([^;]+)'));
        return m ? m[1].trim() : '';
      }
      // 用 template 安全地装入文字（允许内嵌简单 HTML）
      function setHtml(el, text) {
        var t = document.createElement('template');
        t.innerHTML = text || '';
        el.appendChild(t.content);
        return el;
      }
      function el(tag, attrs, html) {
        var e = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (html != null) setHtml(e, html);
        return e;
      }
      var COLORS = [
        { label: '红色', value: '#e60000' }, { label: '橙色', value: '#ea580c' },
        { label: '绿色', value: '#16a34a' }, { label: '蓝色', value: '#2563eb' },
        { label: '紫色', value: '#7c3aed' }, { label: '深灰', value: '#334155' }
      ];
      var SIZES = [
        { label: '小字 14px', value: '14px' }, { label: '正文 16px', value: '16px' },
        { label: '大字 20px', value: '20px' }, { label: '特大 26px', value: '26px' },
        { label: '标题 32px', value: '32px' }
      ];
      var ALIGNS = [
        { label: '居中', value: 'center' }, { label: '左对齐', value: 'left' }, { label: '右对齐', value: 'right' }
      ];
      var POSTS = [
        { label: '你好，世界', value: '/2026/11/10/你好，世界/' },
        { label: '一点闲言碎语', value: '/2026/11/11/一点闲言碎语/' },
        { label: '测试', value: '/2026/11/18/测试/' }
      ];

      /* ---------- 组合强调：一次设颜色+字号，点击已插入的文字还能再改 ----------
         Sveltia 内部对 inline 组件的 onInsert / onEdit 都是 `await` 调用的，
         所以这里可以弹一个面板等用户选完再返回数据。 */
      function emHtml(d) {
        d = d || {};
        var color = d.color || '#e60000', size = d.size || '20px';
        var text = d.text == null ? '强调文字' : d.text;
        var key = 'em-' + String(color).replace(/[^0-9a-zA-Z]/g, '') + '-' + String(size).replace(/[^0-9]/g, '');
        var span = el('span', {
          'data-wb-em': key,
          'class': 'wb-inline ' + sizeClass(size),
          'style': 'color:' + color + ';font-size:' + size + ';'
        });
        setHtml(span, esc(text));
        return span.outerHTML;
      }
      function emFrom(node) {
        return {
          text: node.textContent || '',
          color: styleVal(node, 'color') || '#e60000',
          size: styleVal(node, 'font-size') || sizeFromClass(node) || '20px'
        };
      }
      // mode = 'color' 只显示颜色、'size' 只显示字号、其它＝两者都显示
      function pickStyle(current, sampleText, mode) {
        return new Promise(function (resolve) {
          if (!document.getElementById('wb-pick-style')) {
            var st = document.createElement('style');
            st.id = 'wb-pick-style';
            st.textContent =
              '.wb-pick-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;padding:20px}' +
              '.wb-pick-card{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:22px;box-shadow:0 18px 50px rgba(15,23,42,.28);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1f2430}' +
              '.wb-pick-card h3{margin:0 0 4px;font-size:16px}' +
              '.wb-pick-card .sub{color:#8b93a1;font-size:12px;margin-bottom:14px}' +
              '.wb-pick-prev{padding:14px;border:1px dashed #dfe3ee;border-radius:10px;text-align:center;margin-bottom:14px;min-height:46px;word-break:break-all}' +
              '.wb-pick-label{font-size:12px;color:#8b93a1;margin:10px 0 6px}' +
              '.wb-pick-colors{display:flex;gap:8px;flex-wrap:wrap}' +
              '.wb-pick-colors button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}' +
              '.wb-pick-colors button.on{border-color:#1f2430;box-shadow:0 0 0 2px #fff inset}' +
              '.wb-pick-sizes{display:flex;gap:6px;flex-wrap:wrap}' +
              '.wb-pick-sizes button{border:1px solid #dfe3ee;background:#fbfcff;border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;color:#475569}' +
              '.wb-pick-sizes button.on{border-color:#4a6cf7;background:#eef2ff;color:#3453d4}' +
              '.wb-pick-act{display:flex;gap:8px;margin-top:18px}' +
              '.wb-pick-act button{flex:1;border:0;border-radius:10px;padding:10px;cursor:pointer;font:inherit;font-weight:600}' +
              '.wb-pick-ok{background:#4a6cf7;color:#fff}' +
              '.wb-pick-no{background:#f1f5f9;color:#64748b}' +
              '.wb-pick-clear{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}' +
              '.wb-pick-act.wb-pick-three button{font-size:13px;padding:9px 4px}';
            document.head.appendChild(st);
          }
          var color = (current && current.color) || '#e60000';
          var size = (current && current.size) || '20px';
          var text = (sampleText == null || sampleText === '') ? '示例文字' : sampleText;
          var ov = document.createElement('div');
          ov.className = 'wb-pick-ov';
          var card = document.createElement('div');
          card.className = 'wb-pick-card';
          var showColor = mode !== 'size', showSize = mode !== 'color';
          var title = mode === 'color' ? '🖍 设置文字颜色' : mode === 'size' ? '🔤 设置文字大小' : '🎯 强调这段文字';
          var sub = mode === 'color' ? '选一个颜色；以后点这段文字还能再改'
            : mode === 'size' ? '选一个字号；以后点这段文字还能再改'
              : '一次设好颜色和字号；以后点这段文字还能再改';
          var html = '<h3>' + title + '</h3>' +

            };
          }
          function regInlineSmart(kind, label, icon) {
            var pattern = new RegExp('<span[^>]*data-wb-ic="' + kind + '-[^"]*"[^>]*>[^<]*</span>');
            function make(d) {
              var tmp = document.createElement('div');
              tmp.innerHTML = inlineHtml(kind, d);
              return tmp.firstChild;
            }
            function pick(current, text, editing) {
              return pickStyle(current, text, kind).then(function (p) {
                if (!p) return null;
                // 恢复默认：插入时返回空值让 Sveltia 换成纯文本；编辑时主动派发 insertText
                if (p.clear) { if (editing) clearFormatEditingComponent(); return null; }
                var out = {
                  text: text || (kind === 'color' ? '彩色文字' : '示例文字'),
                  color: (current && current.color) || '',
                  size: (current && current.size) || ''
                };
                if (kind === 'color') out.color = p.color; else out.size = p.size;
                return out;
              });
            }
            safeReg({
              id: 'wb-ic-' + kind,
              label: label,
              icon: icon,
              pattern: pattern,
              fields: [
                { name: 'text', label: '文字', widget: 'string' },
                { name: 'color', label: '颜色', widget: 'string' },
                { name: 'size', label: '字号', widget: 'string' }
              ],
              toBlock: function (d) { return inlineHtml(kind, d); },
              fromBlock: function (m) {
                var str = m && (m[0] || String(m));
                var tmp = document.createElement('div');
                tmp.innerHTML = str;
                return tmp.firstElementChild ? inlineFrom(tmp.firstElementChild) : {};
              },
              toPreview: function (d) { return inlineHtml(kind, d); },
              inlinePattern: {
                onInsert: function (ctx) { return pick(null, (ctx && ctx.selectedText) || '', false); },
                onEdit: function (ctx) {
                  var data = (ctx && ctx.data) || {};
                  markEditingComponent();
                  return pick(data, data.text, true);
                }
              },
              htmlSelector: 'span[data-wb-ic^="' + kind + '-"]',
              fromBlockHTML: inlineFrom,
              toBlockHTML: make
            });
          }
          regInlineSmart('color', '🖍 彩色文字（点已插入的文字可改颜色）', 'format_color_text');
          regInlineSmart('size', '🔤 文字大小（点已插入的文字可改字号）', 'format_size');

          /* ---- 12. 强调文字：颜色+字号一次设好，点一下还能再改 ----
             为什么可行：Sveltia 对 inline 组件的 onInsert / onEdit 都是 await 调用的，
             插入时弹面板等选择；已插入的组件点击会走 onEdit，返回新数据即原地更新。
             这样不用"先变色→再选中→再变字号"，也不会卡在原子节点选不中。 */
          safeReg({
            id: 'wb-em-html',
            label: '🎯 强调文字（一次设颜色+字号，点它能改）',
            icon: 'format_color_text',
            pattern: /<span[^>]*data-wb-em[^>]*>[\s\S]*?<\/span>/,
            fields: [
              { name: 'text', label: '文字', widget: 'string' }
            ],
            toBlock: function (d) { return emHtml(d); },
            fromBlock: function (m) {
              var str = m && (m[0] || String(m));
              var tmp = document.createElement('div');
              tmp.innerHTML = str;
              var n = tmp.firstElementChild;
              return n ? emFrom(n) : {};
            },
            toPreview: function (d) { return emHtml(d); },
            htmlSelector: 'span[data-wb-em]',
            fromBlockHTML: function (n) { return emFrom(n); },
            toBlockHTML: function (d) {
              var tmp = document.createElement('div');
              tmp.innerHTML = emHtml(d);
              return tmp.firstChild;
            },
            inlinePattern: {
              onInsert: function (ctx) {
                var text = (ctx && ctx.selectedText) || '';
                return pickStyle(null, text).then(function (p) {
                  if (!p) return null;
                  if (p.clear) return null; // Sveltia 会把选区替换成纯文本
                  return { text: text || '强调文字', color: p.color, size: p.size };
                });
              },
              onEdit: function (ctx) {
                var data = (ctx && ctx.data) || {};
                markEditingComponent();
                return pickStyle(data, data.text).then(function (p) {
                  if (!p) return null;
                  if (p.clear) { clearFormatEditingComponent(); return null; }
                  return { text: data.text || '强调文字', color: p.color, size: p.size };
                });
              }
            }
          });

          /* ---- 13. 清除格式 ----
             Sveltia 源码里 inlinePattern.onInsert 若没有返回对象，
             会直接把临时组件节点替换成「纯文本节点」。所以这里故意返回 null：
             选中任何带颜色/字号/加粗的文字，点它就会变回普通文字，可继续编辑。 */
          safeReg({
            id: 'wb-clear-html',
            label: '🧹 清除格式（选中文字后点这里，恢复普通文字）',
            icon: 'format_clear',
            pattern: /<span[^>]*data-wb-clear[^>]*>[\s\S]*?<\/span>/,
            fields: [{ name: 'text', label: '文字', widget: 'string' }],
            toBlock: function (d) { return clearHtml(d); },
            fromBlock: function (m) {
              var str = m && (m[0] || String(m));
              var tmp = document.createElement('div');
              tmp.innerHTML = str;
              return { text: tmp.textContent || '' };
            },
            toPreview: function (d) { return clearHtml(d); },
            htmlSelector: 'span[data-wb-clear]',
            fromBlockHTML: function (n) { return { text: n.textContent || '' }; },
            toBlockHTML: function (d) {
              var tmp = document.createElement('div');
              tmp.innerHTML = clearHtml(d);
              return tmp.firstChild;
            },
            inlinePattern: {
              onInsert: function () { return null; }
            }
          });

          window.__wbHtmlComboReady = true;
          return true;
        } catch (e) {
          window.__wbHtmlComboError = String(e && e.message || e);
          console.error('[组件注册总入口失败]', e);
          return false;
        }
      }

      /* ---------- 各组件的 DOM 构造（inline + class 双写） ---------- */
      function clearHtml(d) {
        d = d || {};
        var e = el('span', { 'data-wb-clear': '1' }, esc(d.text || '普通文字'));
        return e.outerHTML;
      }
      function buildCombo(d) {
        d = d || {};
        var align = d.align || 'center', color = d.color || '#e60000', size = d.size || '20px';
        var e = el('div', {
          'data-wb-combo': '1',
          'class': sizeClass(size),
          'style': 'text-align:' + align + ';color:' + color + ';font-size:' + size + (d.bold ? ';font-weight:bold' : '') + ';'
        });
        return setHtml(e, d.text || '要排版的文字');
      }
      function buildAlign(d) {
        d = d || {};
        var e = el('div', { 'data-wb-align': '1', 'style': 'text-align:' + (d.align || 'center') + ';' });
        return setHtml(e, d.text || '居中文字');
      }
      function buildColor(d) {
        d = d || {};
        var e = el('span', { 'data-wb-color': '1', 'style': 'color:' + (d.color || '#e60000') + ';' });
        return setHtml(e, d.text || '彩色文字');
      }
      function buildSize(d) {
        d = d || {};
        var s = d.size || '20px';
        var e = el('span', { 'data-wb-size': '1', 'class': sizeClass(s), 'style': 'font-size:' + s + ';' });
        return setHtml(e, d.text || '不同字号的文字');
      }
      function buildCallout(d) {
        d = d || {};
        var type = d.type || '提示';
        var mark = { '提示': '💡 提示：', '注意': '⚠️ 注意：', '重点': '📌 重点：', '警告': '🚫 警告：', '金句': '💬 ' }[type] || '提示：';
        var e = el('blockquote', { 'data-wb-callout': type, 'class': 'wb-callout-hl' });
        return setHtml(e, esc(mark) + (d.content || ''));
      }
      function buildButton(d) {
        d = d || {};
        return el('a', { 'data-wb-button': '1', 'class': 'wb-btn-hl', 'href': d.url || 'https://', 'target': '_blank', 'rel': 'noopener noreferrer' }, esc(d.text || '点这里'));
      }
      function buildCaption(d) {
        d = d || {};
        return el('em', { 'data-wb-caption': '1', 'class': 'wb-cap-hl' }, esc(d.text || '图注说明'));
      }
      function buildTable(d) {
        d = d || {};
        var cols = Math.max(2, Math.min(6, parseInt(d.cols, 10) || 3));
        var rows = Math.max(1, Math.min(5, parseInt(d.rows, 10) || 2));
        var t = el('table', { 'data-wb-table': '1', 'class': 'wb-table-hl', 'data-wb-cols': String(cols), 'data-wb-rows': String(rows) });
        var thead = document.createElement('thead'), hr = document.createElement('tr');
        var tbody = document.createElement('tbody');
        for (var c = 1; c <= cols; c++) {
          var th = document.createElement('th'); th.textContent = '列' + c; hr.appendChild(th);
        }
        thead.appendChild(hr); t.appendChild(thead);
        for (var r = 0; r < rows; r++) {
          var tr = document.createElement('tr');
          for (var k = 0; k < cols; k++) { var td = document.createElement('td'); td.textContent = ' '; tr.appendChild(td); }
          tbody.appendChild(tr);
        }
        t.appendChild(tbody);
        return t;
      }
      function buildPostLink(d) {
        d = d || {};
        var url = d.post || POSTS[0].value, label = d.text || '';
        if (!label) {
          for (var i = 0; i < POSTS.length; i++) if (POSTS[i].value === url) { label = POSTS[i].label; break; }
          if (!label) label = url;
        }
        return el('a', { 'data-wb-postlink': '1', 'href': url }, esc(label));
      }

      // CMS 可能是先占位后赋值，用 setter 钩住，赋值那一刻立刻注册
      var _cms = window.CMS;
      if (!registerAll()) {
        Object.defineProperty(window, 'CMS', {
          configurable: true,
          get: function () { return _cms; },
          set: function (v) {
            _cms = v;
            try { if (v) registerAll(); } catch (e) {}
          }
        });
      }

      /* ---------- 正文「插入」菜单顺序 ----------
         顺序保存在 site.yml 的 editor_components，构建时由 scripts/admin-gate.js
         内联成 window.__WB_EDITOR_ORDER__。这里在 CMS 读取 config.yml 时临时
         注入 field_defaults.richtext.editor_components，Sveltia 会按这个顺序
         排「插入」菜单。因为顺序文件在 Git 里，改一次所有设备同步。 */
      function applyToolbarOrder() {
        if (window.__wbConfigFetchPatched) return;
        window.__wbConfigFetchPatched = true;
        var order = window.__WB_EDITOR_ORDER__;
        if (!Array.isArray(order) || !order.length || typeof window.fetch !== 'function') return;
        var origFetch = window.fetch;
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          if (!/\/config\.yml(?:\?|$)/.test(url) || /\/(cms|cms-html|tina)\//.test(url)) {
            return origFetch.apply(window, arguments);
          }
          return origFetch.call(window, input, init).then(function (res) {
            return res.text().then(function (body) {
              // 已显式配置过就尊重原配置，不重复注入
              if (/^field_defaults\s*:/m.test(body)) return res;
              var lines = ['field_defaults:', '  richtext:', '    editor_components:'];
              order.forEach(function (id) { lines.push('      - ' + JSON.stringify(String(id))); });
              var opts = { status: res.status, statusText: res.statusText, headers: res.headers };
              return new Response(lines.join('\n') + '\n' + body, opts);
            });
          });
        };
        window.__wbToolbarOrderApplied = order.slice();
      }

      // 真正启动 CMS。密码门验证通过后才会调用它（没设密码则立即调用）。
      window.__wbStartCMS = function () {
        if (window.__wbCMSStarted) return;
        try {
          if (typeof window.CMS === 'undefined' || typeof window.CMS.init !== 'function') {
            throw new Error('CMS 对象未就绪');
          }
          applyToolbarOrder();
          window.CMS.init();
          window.__wbCMSStarted = true;
          window.__wbHtmlDemoReady = true;
        } catch (e) {
          console.error('[CMS 启动失败]', e);
          window.__wbHtmlDemoReady = false;
        }
      };
      window.__wbHtmlComboLoaded = LOADED;

      /* ---------- 撤销/恢复悬浮按钮 ----------
         Lexical（Sveltia 富文本内核）原生支持 historyUndo / historyRedo，
         但必须通过 beforeinput 事件触发（合成 KeyboardEvent 不会生效）。
         这里在正文编辑器上派发这两个 inputType，等价于 Ctrl+Z / Ctrl+Y。 */
      (function () {
        var undoBtn = document.getElementById('wb-history-undo');
        var redoBtn = document.getElementById('wb-history-redo');
        function findEditor() {
          var a = document.activeElement;
          if (a && a.matches && a.matches('.lexical-root[contenteditable="true"]')) return a;
          var list = document.querySelectorAll('.lexical-root[contenteditable="true"]');
          for (var i = 0; i < list.length; i++) {
            if (list[i].getClientRects && list[i].getClientRects().length) return list[i];
          }
          return null;
        }
        function fire(type) {
          var ed = findEditor();
          if (!ed) { console.warn('[撤销/恢复] 未找到正文编辑器，请先点一下正文'); return false; }
          try { ed.focus({ preventScroll: true }); } catch (e) { try { ed.focus(); } catch (e2) {} }
          var ev;
          try {
            ev = new InputEvent('beforeinput', {
              inputType: type, bubbles: true, cancelable: true, composed: true, data: null
            });
          } catch (e) {
            ev = document.createEvent('Event');
            ev.initEvent('beforeinput', true, true);
            try { Object.defineProperty(ev, 'inputType', { value: type }); } catch (e2) {}
          }
          return ed.dispatchEvent(ev);
        }
        if (undoBtn) {
          undoBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
          undoBtn.addEventListener('click', function () { fire('historyUndo'); });
        }
        if (redoBtn) {
          redoBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
          redoBtn.addEventListener('click', function () { fire('historyRedo'); });
        }
        window.__wbFireHistory = fire; // 便于自动化验证
        window.__wbHistoryReady = true;
      })();
    })();
  </script>

  <!-- 网站访问密码门：验证通过后才调用 __wbStartCMS 启动写作后台 -->
  <script>
    (function () {
      var hash = String(window.__WB_ADMIN_HASH__ || '').toLowerCase();
      var gate = document.getElementById('wb-admin-gate');
      // 提前声明，避免「无密码直接放行」时 unlock() 里 PREFIX 还是 undefined 导致锁定按钮不出现
      var PREFIX = hash.slice(0, 12);
      var KEY = 'wb_admin_unlock_' + PREFIX;
      var SAVE = 'wb_admin_pw_' + PREFIX;

      function unlock() {
        if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
        // 已放行：右下角留一个「锁定后台」按钮，点它清掉记住的密码并刷新，回到输密码状态
        if (PREFIX) showLockBtn();
        // CMS 脚本（2.6MB）可能还没加载完，__wbStartCMS 尚未定义，
        // 这里轮询等它就绪，避免空密码时被跳过导致后台起不来。
        var tries = 0;
        var timer = setInterval(function () {
          if (typeof window.__wbStartCMS === 'function') {
            clearInterval(timer);
            window.__wbStartCMS();
          } else if (++tries > 120) {
            clearInterval(timer); // 超时 12 秒，交给页面自带的报错提示处理
          }
        }, 100);
      }

      // 解锁后右下角的「锁定后台」按钮：清掉记住的密码并刷新，回到未输入状态
      function showLockBtn() {
        if (document.getElementById('wb-lock-float')) return;
        var b = document.createElement('button');
        b.id = 'wb-lock-float';
        b.className = 'wb-lock-float';
        b.type = 'button';
        b.textContent = '🔒 锁定后台';
        b.title = '清除记住的密码，回到输密码状态';
        b.onclick = function () {
          try {
            localStorage.removeItem(SAVE);
            localStorage.removeItem(KEY);
            sessionStorage.removeItem(KEY);
          } catch (e) {}
          location.reload();
        };
        (document.body || document.documentElement).appendChild(b);
      }

      // 没设密码：直接放行
      if (!hash) { unlock(); return; }

      // 本次会话已解锁，或之前勾了「记住密码」且验证通过：直接放行
      try {
        if (sessionStorage.getItem(KEY) === '1' || localStorage.getItem(KEY) === '1') { unlock(); return; }
      } catch (e) {}

      // 需要密码：显示门
      if (gate) gate.style.display = 'flex';
      var form = document.getElementById('wb-gate-form');
      var input = document.getElementById('wb-gate-pw');
      var msg = document.getElementById('wb-gate-msg');
      var btn = document.getElementById('wb-gate-go');
      var remember = document.getElementById('wb-gate-remember');
      if (!form) return;

      // 之前勾过「记住密码」：把密码带回来，并自动勾上
      try {
        var saved = localStorage.getItem(SAVE);
        if (saved && remember) { input.value = saved; remember.checked = true; }
      } catch (e) {}

      function hex(buf) {
        var a = new Uint8Array(buf), s = '';
        for (var i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2);
        return s;
      }
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var val = input.value;
        if (!val) { msg.textContent = '请输入密码'; return; }
        if (!(window.crypto && crypto.subtle)) { msg.textContent = '浏览器太旧，换一个再试'; return; }
        btn.disabled = true; msg.textContent = '校验中…';
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(val)).then(function (buf) {
          if (hex(buf) === hash) {
            try {
              if (remember && remember.checked) {
                localStorage.setItem(KEY, '1');
                localStorage.setItem(SAVE, val);
              } else {
                sessionStorage.setItem(KEY, '1');
                localStorage.removeItem(KEY);
                localStorage.removeItem(SAVE);
              }
            } catch (e) {}
            msg.textContent = '';
            unlock();
          } else {
            msg.textContent = '密码不对，再试一次';
            input.value = ''; input.focus(); btn.disabled = false;
          }
        }).catch(function () { msg.textContent = '校验出错，刷新页面重试'; btn.disabled = false; });
      });
      if (input) input.focus();
    })();
  </script>

  <script>
    setTimeout(function () {
      // 用真实的启动标记判断，不再靠猜 DOM class（会误报"界面没起来"）
      if (window.__wbCMSStarted) return;
      var tip = document.getElementById('fallback');
      if (tip) {
        var h = tip.querySelector('h1');
        var sub = tip.querySelector('.wb-load-sub');
        if (h) h.textContent = '脚本已加载，但界面没起来';
        if (sub) sub.innerHTML =
          '多半是配置写错了，按 F12 看控制台红色报错，或者把报错发我。';
      }
    }, 15000);
  </script>
</body>
