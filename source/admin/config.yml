# ==========================================================
#  主力写作后台（/admin）—— Sveltia 0.270 HTML 富文本模式
#  打开：https://v-jinci.github.io/admin/
#  登录：点「Sign In with Token」→ 粘贴 GitHub 令牌（勾选 repo）
#
#  正文用 richtext + format: html：所见即所得，工具栏带对齐/下划线/
#  任务清单等 17 个按钮，「插入」菜单里还有 10 个一键排版组件。
#  编辑的是正式文章 source/_posts，保存自动提交到 hexo-src 分支。
#
#  /cms/ 仍是 Markdown 后台（保持不变）；/tina/ 是 Tina（辅助）。
#  三套后台都指向同一批文章，但正文格式不同，切勿混用保存同一篇，
#  否则会互相覆盖正文格式。日常写作请用本后台 /admin。
# ==========================================================

backend:
  name: github
  repo: v-jinci/v-jinci.github.io
  branch: hexo-src

site_url: https://v-jinci.github.io
display_url: https://v-jinci.github.io

# 图片：上传进 source/img/，正文里写成 /img/xxx.png
media_folder: source/img
public_folder: /img

locale: zh_Hans

collections:
  # ---------------- 文章 ----------------
  - name: posts
    label: 文章
    label_singular: 文章
    folder: source/_posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - label: 标题
        name: title
        widget: string
        hint: 显示在首页卡片和浏览器标签上

      - label: 发布日期
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        format: "YYYY-MM-DD HH:mm:ss"
        hint: 决定首页排序和网址里的日期

      - label: 摘要（首页卡片的两行简介）
        name: description
        widget: text
        required: false
        hint: 不填会自动截正文开头，常常是半句话，建议自己写一两句

      - label: 标签
        name: tags
        widget: list
        required: false
        hint: 想加几个就加几个，回车分隔（例：Hexo、折腾记录）

      - label: 分类
        name: categories
        widget: list
        required: false
        hint: 一般只填一个（例：技术）

      - label: 封面图（可不填）
        name: cover
        widget: image
        required: false
        hint: 首页卡片和「上一篇/下一篇」用这张图打底；建议横图 1200×675

      # ---------- 排版与显示开关（都可以不填） ----------
      - label: 系列 / 专栏
        name: series
        widget: string
        required: false
        hint: 填一个名字，同名文章会在文末自动生成「系列合集」目录

      - label: 置顶
        name: sticky
        widget: select
        required: false
        default: "0"
        options:
          - label: 不置顶（默认）
            value: "0"
          - label: 置顶 1（最优先）
            value: "1"
          - label: 置顶 2
            value: "2"
          - label: 置顶 3
            value: "3"

      - label: 显示评论区
        name: comments
        widget: boolean
        required: false
        default: true

      - label: 显示右侧目录
        name: toc
        widget: boolean
        required: false
        default: true

      - label: 访问密码（留空＝公开）
        name: password
        widget: string
        required: false
        hint: 填了之后网页上要输密码才能看，正文在源码里也是加密的

      - label: 正文图片宽度（只影响这一篇）
        name: img_width
        widget: string
        required: false
        hint: 填数字＝百分比，40 就是 40%；留空跟随全站默认

      - label: 正文图片排版（文字在图的哪一侧）
        name: img_float
        widget: select
        required: false
        options:
          - label: 自动（窄图左环绕，文字在右）
            value: auto
          - label: 左环绕 —— 图片在左，文字在右边
            value: l
          - label: 右环绕 —— 图片在右，文字在左边
            value: r
          - label: 居中 —— 图片单独一行
            value: c

      # ---------- 转载 ----------
      - label: 自定义链接（一般不用改）
        name: permalink
        widget: string
        required: false
        hint: 锁定这篇文章的网址，防止旧链接失效；不知道是什么就别动它

      - label: 转载来源名称
        name: reprint_name
        widget: string
        required: false

      - label: 转载原文链接
        name: reprint_url
        widget: string
        required: false

      # ---------- 老文章里常见的字段（保留，防止保存时被删） ----------
      - label: 顶部大图 top_img（老字段）
        name: top_img
        widget: string
        required: false

      - label: 更新时间 updated（老字段）
        name: updated
        widget: datetime
        required: false
        date_format: "YYYY-MM-DD HH:mm:ss"
        time_format: "HH:mm:ss"
        format: "YYYY-MM-DD HH:mm:ss"

      - label: 作者 author（老字段）
        name: author
        widget: string
        required: false

      # ---------- 正文：HTML 富文本 ----------
      - label: 正文
        name: body
        widget: richtext
        format: html
        buttons:
          - bold
          - italic
          - underline
          - strikethrough
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - heading-four
          - heading-five
          - heading-six
          - bulleted-list
          - numbered-list
          - task-list
          - quote
          - align
        hint: >-
          所见即所得编辑：选中文字点工具栏即可加粗/斜体/下划线/对齐/列表等。
          「插入」菜单里还有 10 个一键组件：🎨综合排版（居中+颜色+字号+加粗一次搞定）、
          段落对齐/彩色文字/字号、💡提示卡片、🔘按钮链接、🖼图注、➖分割线、
          📊表格、🔗站内文章链接。点右上角「源码/Raw」可看生成的 HTML。

  # ---------------- 独立页面 ----------------
  - name: pages
    label: 独立页面
    files:
      - label: 关于
        name: about
        file: source/about/index.md
        format: yaml-frontmatter
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 正文, name: body, widget: richtext, format: html }

      - label: 友链
        name: link
        file: source/link/index.md
        format: yaml-frontmatter
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 正文, name: body, widget: richtext, format: html }

      - label: 留言板
        name: messageBoard
        file: source/messageBoard/index.md
        format: yaml-frontmatter
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 正文（留言板本身是空的，评论会渲染在下面）, name: body, widget: richtext, format: html }

      - label: 编年史
        name: history
        file: source/history/index.md
        format: yaml-frontmatter
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 正文, name: body, widget: richtext, format: html }
