# 站点设置：本地 http://localhost:4000/site 与远程 /admin 编辑的都是这一份
# 保存后提交到 hexo-src，等自动部署完成就上线。

# 站点文字：写了什么键就覆盖 _config.yml 的同名键（构建时由 scripts/wb-settings.js 应用）
hexo:
  title: "玮's Blog"
  subtitle: "What can happen will happen"
  description: "记录思考、学习与生活的个人博客"
  keywords: "玮,博客,日志,生活记录,读书笔记"
  author: "玮"
  language: "zh-CN"

mail: "599676700@qq.com"

# 写作后台 /admin 的访问密码（明文填写，构建时自动转成 SHA-256）
# 留空＝不要密码，点导航「写作」直接进。这层只挡随手点进来的人，真正保护靠 GitHub 令牌。
admin_password: "19981227."

# 写作后台 /admin 正文「插入」菜单的顺序。
# 也可以在 /admin → 站点设置 → 基本信息 →「正文工具栏顺序」里上下拖动调整，
# 保存后等自动部署完成，其他设备打开就是新顺序。删掉某一行＝在菜单里隐藏它。
