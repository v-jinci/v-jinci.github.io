# ==========================================================
#  Butterfly 主题配置（只覆盖需要改的部分）
#  想调整颜色/字体/布局，改这里即可
# ==========================================================

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

# 顶部导航：改文字就能改名字，后面 || 是图标
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  友链: /link/ || fas fa-link
  编年史: /history/ || fas fa-history
  留言板: /messageBoard/ || far fa-comment-dots
  下载: /downloads/ || fas fa-download
  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/v-jinci || Github || Github || Github || Github
  fas fa-envelope: mailto:599676700@qq.com || Email

avatar:
  img: /img/Avatar.png
  effect: false

favicon: /img/favicon.ico

disable_top_img: false

# 顶部大图（首页 + 内页统一用这张；想换图把文件放进 source/img 再改这里的文件名）
default_top_img: /img/V_bg.jpg
index_img: /img/V_bg.jpg

# 首页大标题下面的轮播文案
subtitle:
  enable: true
  effect: true
  # 打字效果参数（/site 后台「站点文字」里可调）
  # typeSpeed 数值越小打得越快；backDelay 是每句打完停多久（毫秒）
  typed_option:
    typeSpeed: 150
    backSpeed: 50
    backDelay: 1500
    startDelay: 300
    loop: true
  source: false
  sub:
    - 有可能的就一定会发生
    - 吾不识青天高，黄地厚。
    - 唯见月寒日暖，来煎人寿。

# 首页文章摘要：3 = 自动截取正文
index_post_content:
  method: 3
  length: 275

# 目录
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# 版权声明
post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 右下角工具按钮
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

readmode: true
rightside_scroll_percent: true

# 本地搜索（不用联网、不用配置任何服务）
search:
  use: local_search
  placeholder: 搜索文章…
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false
    CDN:

# 关闭第三方统计（需要时再开）
busuanzi:
  enable: false

# 侧边栏卡片
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 记录思考，慢慢成长。
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/v-jinci
  card_announcement:
    enable: true
    content: 欢迎来到我的小站，随便逛逛～
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    sort: length
    sort_order:
  card_tags:
    enable: true
    limit: 20
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date:

footer:
  nav:
  owner:
    enable: true
    since: 2021
  copyright:
    enable: true
    version: false
  custom_text:

# ==========================================================
#  背景图（都在 /site 后台「外观图片」里可视化修改，不用手改这里）
#
#  wb_look.nav_bg ：文章底部「上一篇 / 下一篇」卡片的背景图。
#  footer_img     ：页脚背景图。留空 '' 就是纯色。
#  想换成自己的照片：把图片放进 source/img/，再改文件名即可。
# ==========================================================
footer_img: /img/footer-bg.svg

wb_look:
  # 文章底部「上一篇 / 下一篇」卡片的背景图
  nav_bg: /img/nav-cover.svg
  # 主页头部背景：多张图会自动轮播；hero_video 设了就用视频（图片当封面）
  hero_images:
    - /img/43a60f5fde29122e133f18d79dbd109f5a7aaffb.jpg
    - /img/457f3ea1d92b768fd9c5fdd125c884eb58cb405c.jpg
    - /img/2024-01-07-_17-50-56.23_CachedImage_1920.jpg
  hero_video: /media/mp4.mp4
  hero_interval: 6
  hero_scope: home
  hero_overlay: 20
  # 首页大标题下面那行字的样式（0 / 空 = 跟随主题）
  sub_size: 0
  sub_spacing: 0
  sub_color: ''
  sub_weight: 0
  # ---- 细节开关（/site 后台「细节开关」里改，不用手改） ----
  # 正文图片点一下全屏放大
  img_zoom: true
  # 页脚「本站已运行 XXX 天」小徽章
  uptime_enable: true
  uptime_since: 2021-01-01
  uptime_text: '本站已运行 {days} 天'
  # 首页排版见下面顶层的 index_layout（/site 后台「细节开关」里切换）
  # 自定义 404 页面（生成 public/404.html，GitHub Pages 会自动使用）
  notfound_enable: true
  notfound_title: 404
  notfound_subtitle: 这一页走丢了
  notfound_text: 地址可能拼错、文章可能挪了位置，也可能它从来就没存在过。
  notfound_btn: 回到首页

# 页面顶部图（留空则用主题默认渐变，干净清爽）

# 首页文章排版（/site 后台「细节开关」里切换）
#   1 = 图文大卡片·图在左   2 = 图文大卡片·图在右   3 = 交错小卡片（默认）
#   6 / 7 = 瀑布流（按高度错落排布）
#   想要"图文"效果，文章自己得先设置封面图（Pages CMS 表单里有"封面图"一格）
index_layout: 6

# ==========================================================
#  评论区（Waline）
#  访客填个昵称就能留言，不用注册任何账号。
#  评论存在 Vercel + Neon 数据库里，服务端：https://weiblog-comments.vercel.app
#  管理后台：https://weiblog-comments.vercel.app/ui
#  想临时关掉评论：把下面 use 那行改成空值（use:）
#  想换回 Giscus：把 use 改成 Giscus（下面的 giscus 配置一直留着）
# ==========================================================
comments:
  use: Waline
  text: true
  # 滚动到评论区才加载，打开页面更快
  lazyload: true
  count: false
  card_post_count: false

waline:
  # 走 Netlify 转发节点（vercel.app 域名在国内被 DNS 污染，访客打不开）
  # Netlify 只做请求转发，真正的服务端、数据、后台都还在 Vercel + Neon，没有迁移
  serverURL: 'https://weiblog-comments.netlify.app'
  bg:
  # 用 Waline 的阅读量统计（会多一次请求，先不开）
  pageview: false
  option:
    lang: zh-CN
    # 昵称必填；邮箱和网址选填，填了才会收到回复提醒
    requiredMeta: [nick]
    meta: [nick, mail, link]
    pageSize: 10
    commentSorting: latest
    login: disable

# 旧的 Giscus（现在没启用，留着备用）
giscus:
  repo: v-jinci/v-jinci.github.io
  repo_id: R_kgDOLV2ueQ
  category_id: DIC_kwDOLV2uec4DK0JX
  light_theme: light
  dark_theme: dark
  js: https://giscus.app/client.js
  option:
    data-lang: zh-CN
    data-strict: '1'
    data-input-position: top
    data-loading: lazy
    data-reactions-enabled: '1'

# ==========================================================
#  自定义注入
#
#  为什么隐藏评论里的「地区」：
#  网站走 Netlify 转发到 Vercel，服务端看到的永远是转发节点的 IP（新加坡），
#  所以每个访客都被标成「新加坡」，显示出来反而误导。真要大致的地区，
#  得去掉转发或者绑自己的域名，以后再说。
# ==========================================================
inject:
  head:
    - <link rel="icon" href="/img/favicon.ico?v=3">
    - <link rel="apple-touch-icon" href="/img/favicon.ico?v=3">
    - <style>.wl-addr{display:none!important}</style>
    - |
      <style>
      /* ---- 文章底部「上一篇 / 下一篇」：图片打底 + 暗色遮罩，保证文字看得清 ---- */
      /* 背景图来自 wb_look.nav_bg（/site 后台可改），由 scripts/wb-look.js 注入成 CSS 变量 */
      #pagination.pagination-post a.pagination-related{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 6px 20px rgba(15,23,42,.10)}
      #pagination.pagination-post a.pagination-related .cover{
        background-image:var(--wb-nav-bg,url('/img/nav-cover.svg'))!important;
        background-size:cover!important;background-position:center!important;background-color:transparent!important}
      #pagination.pagination-post a.pagination-related:nth-of-type(2) .cover{
        background-image:var(--wb-nav-bg2,var(--wb-nav-bg,url('/img/nav-cover3.svg')))!important}
      #pagination.pagination-post a.pagination-related:hover .cover{opacity:1!important}
      #pagination.pagination-post a.pagination-related::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
        background:linear-gradient(120deg,rgba(8,15,28,.42),rgba(8,15,28,.16) 55%,rgba(8,15,28,.38))}
      /* 文字是绝对定位的，只抬层级、不改变定位方式，否则会跑到卡片顶部 */
      #pagination.pagination-post a.pagination-related .info .info-1,
      #pagination.pagination-post a.pagination-related .info .info-2{position:absolute;z-index:2}
      #pagination.pagination-post .info-item-1,
      #pagination.pagination-post .info-item-2{color:rgba(255,255,255,.96)!important;text-shadow:0 1px 4px rgba(0,0,0,.5)}
      #pagination.pagination-post .info-1 .info-item-1{opacity:.72;letter-spacing:.08em}

      /* ---- 页脚：背景图 + 遮罩 + 白字 ---- */
      #footer{position:relative;background-size:cover;background-position:center;background-repeat:no-repeat}
      #footer::before{content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(180deg,rgba(6,12,24,.4),rgba(6,12,24,.62))}
      #footer>*{position:relative;z-index:1}
      #footer,
      #footer a,
      #footer .footer-copyright,
      #footer .footer-other,
      #footer .footer-separator{color:rgba(255,255,255,.9)!important}
      #footer a:hover{color:#fff!important;text-decoration:underline}
      /* 深色模式下别压得太黑 */
      html[data-theme="dark"] #footer::before{background:linear-gradient(180deg,rgba(6,12,24,.45),rgba(6,12,24,.68))}
      </style>
